name: CI/CD - Teste e Deploy

# Aciona o workflow em push ou pull request para as branches main e develop
on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório
      - uses: actions/checkout@v3

      # 2. Configura o Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      # 3. Instala dependências
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 # Ferramenta de linting (análise estática)

      # 4. Roda verificação de sintaxe e estilo (Linting)
      - name: Lint with flake8
        run: |
          # para o build se houver erros de sintaxe ou nomes indefinidos
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  deploy:
    # Precisa que o job 'build' termine com sucesso
    needs: build
    runs-on: ubuntu-latest
    # Este job só roda em push para a branch 'main'
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v3
      - uses: superfly/fly-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          # Usa o token que você salvou nos segredos do GitHub
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
