name: CI - Testes e Lint

# Aciona o workflow quando houver push na branch main
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório
      - uses: actions/checkout@v3

      # 2. Configura o Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      # 3. Instala dependências
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 # Ferramenta de linting (análise estática)

      # 4. Roda verificação de sintaxe e estilo (Linting)
      - name: Lint with flake8
        run: |
          # para o build se houver erros de sintaxe ou nomes indefinidos
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
